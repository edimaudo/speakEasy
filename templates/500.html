<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5f1">
  <meta name="robots" content="noindex, nofollow">
  <title>Something went wrong — SpeakEasy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        const prefs = JSON.parse(localStorage.getItem("speakeasy.preferences.v1") || "{}");
        document.documentElement.dataset.theme = prefs.theme === "dark" ? "dark" : "light";
        document.documentElement.dataset.fontSize = ["small", "medium", "large"].includes(prefs.fontSize) ? prefs.fontSize : "medium";
      } catch (_) { document.documentElement.dataset.theme = "light"; document.documentElement.dataset.fontSize = "medium"; }
    })();
  </script>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="error-page-body">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div class="error-page-shell">
    <header class="error-page-header">
      <a class="brand" href="/" aria-label="SpeakEasy home">SpeakEasy</a>
    </header>
    <main id="main-content" class="error-page-main" tabindex="-1">
      <p class="error-code error-code-server" aria-hidden="true">500</p>
      <h1>We hit a pause.</h1>
      <p class="error-page-copy">Something went wrong. Return to SpeakEasy and try again.</p>
      <a class="button button-primary error-home-button" href="/">Return to SpeakEasy <span aria-hidden="true">→</span></a>
    </main>
  </div>
</body>
</html>
