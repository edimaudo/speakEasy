<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5f1">
  <meta name="robots" content="noindex, nofollow">
  <title>Page not found — SpeakEasy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        const prefs = JSON.parse(localStorage.getItem("speakeasy.preferences.v1") || "{}");
        document.documentElement.dataset.theme = prefs.theme === "dark" ? "dark" : "light";
        document.documentElement.dataset.fontSize = ["small", "medium", "large"].includes(prefs.fontSize) ? prefs.fontSize : "medium";
      } catch (_) { document.documentElement.dataset.theme = "light"; document.documentElement.dataset.fontSize = "medium"; }
    })();
  </script>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="error-page-body">
  <div class="error-page-shell">
    <header class="error-page-header">
      <a class="brand" href="/" aria-label="SpeakEasy home">
        SpeakEasy<span class="brand-period">.</span>
      </a>
    </header>
    <main class="error-page-main">
      <p class="error-code" aria-hidden="true">404</p>
      <h1>That page isn't part of the conversation.</h1>
      <p class="error-page-copy">The address may be incorrect, or the page may have moved. Let's get you back to your practice.</p>
      <a class="button button-primary error-home-button" href="/">Return to SpeakEasy <span aria-hidden="true">→</span></a>
      <p class="error-page-footnote">Your practice history is not affected.</p>
    </main>
  </div>
</body>
</html>
